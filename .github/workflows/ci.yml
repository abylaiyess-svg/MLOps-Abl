name: MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train-and-gate:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: http://localhost:5000
      MLFLOW_S3_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MLflow stack
        # Compose v2 ("docker compose"): v1 ("docker-compose") is no longer
        # preinstalled on ubuntu-24.04 runners.
        run: docker compose up -d

      - name: Wait for MLflow
        # Сервер MLflow доустанавливает psycopg2/boto3 при старте, готовность
        # занимает десятки секунд — фиксированный sleep здесь ненадёжен.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "MLflow готов через $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "MLflow не поднялся за 300s"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data
        run: python prepare_data.py

      - name: Train model
        run: python train.py

      - name: Quality gate
        run: python eval_gate.py

      - name: Dump stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
